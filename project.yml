name: CloudTunes
options:
  bundleIdPrefix: com.gysbs
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  CloudTunes:
    type: application
    platform: iOS
    sources:
      - path: CloudTunes
    dependencies:
      - target: CloudTunesWidget
    entitlements:
      path: CloudTunes/CloudTunes.entitlements
    info:
      path: CloudTunes/Info.plist
      properties:
        CFBundleDisplayName: 汤圆云音盒
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.gysbs.cloudtunes
            CFBundleURLSchemes:
              - cloudtunes
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gysbs.cloudtunes
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CloudTunesWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CloudTunesWidget
      - path: CloudTunes/Shared
    entitlements:
      path: CloudTunesWidget/CloudTunesWidget.entitlements
    info:
      path: CloudTunesWidget/Info.plist
      properties:
        CFBundleDisplayName: 汤圆云音盒
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gysbs.cloudtunes.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
schemes:
  CloudTunes:
    build:
      targets:
        CloudTunes: all
    run:
      config: Debug
