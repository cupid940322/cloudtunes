name: CloudTunes
options:
  bundleIdPrefix: com.gysbs
  createIntermediateGroups: true
  # 注意：XcodeGen 新版默认生成的工程格式是 xcode16_0（objectVersion 77），
  # 而 macos-14 runner 上只有 Xcode 15.4，打不开这种格式，会直接报
  # `The project 'CloudTunes' cannot be opened because it is in a future
  # Xcode project file format (77)`。这里显式钉成 Xcode 15.3 的格式，
  # 保证两个 runner 池（macos-14 / macos-15）都能编译。
  projectFormat: xcode15_3
  xcodeVersion: "15.3"
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  CloudTunes:
    type: application
    platform: iOS
    sources:
      - path: CloudTunes
        excludes:
          - "Resources/**"
    dependencies:
      - target: CloudTunesWidget
    entitlements:
      path: CloudTunes/CloudTunes.entitlements
    info:
      path: CloudTunes/Info.plist
      properties:
        # 注意：这里必须是纯 ASCII。
        # AltStore 注册 App ID 时会过滤掉非 ASCII 字符，
        # 中文名被过滤成空串后就会报 `The name "" contains invalid characters`。
        # 桌面显示的中文名由 Resources/zh-Hans.lproj/InfoPlist.strings 提供。
        CFBundleDisplayName: TangYuanMusic
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.gysbs.cloudtunes
            CFBundleURLSchemes:
              - cloudtunes
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gysbs.cloudtunes
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # libdca（DTS 解码）是 CI 现编的静态库，本地没有也能编译（bridging header 里
        # 用 __has_include 做了 fallback 声明），只有 DTS 播放会在链接期缺符号。
        SWIFT_OBJC_BRIDGING_HEADER: CloudTunes/CloudTunes-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Libraries/libdca/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Libraries/libdca
        OTHER_LDFLAGS:
          - -ldca
  CloudTunesWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CloudTunesWidget
      - path: CloudTunes/Shared
    entitlements:
      path: CloudTunesWidget/CloudTunesWidget.entitlements
    info:
      path: CloudTunesWidget/Info.plist
      properties:
        CFBundleDisplayName: TangYuanMusicWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gysbs.cloudtunes.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
schemes:
  CloudTunes:
    build:
      targets:
        CloudTunes: all
    run:
      config: Debug
