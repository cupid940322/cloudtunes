name: DTS decode fingerprint (offline check)

# 只在 dts-test 分支跑：用和 iOS 版**完全相同**的编译标志，在 arm64 上
# 把 libdca 0.0.7 + App 里的 DTSDecoder.swift 真跑一遍，打印解码指纹，
# 再和本机 ffmpeg 的解码结果对比，判断"背景噪音"是不是解码器本身的问题。
#
# 所有输出都 tee 到 dts.log，失败时把日志推到 ci-dts-tmp 分支（本机没有 gh，看不到 Actions 日志）。
on:
  push:
    branches: [dts-test]
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run everything (log captured)
        run: |
          set -o pipefail
          exec > >(tee dts.log) 2>&1
          set -x

          LIBDCA_VER=0.0.7
          WORK="$RUNNER_TEMP/libdca"
          rm -rf "$WORK"; mkdir -p "$WORK"
          curl -fsSL "https://download.videolan.org/pub/videolan/libdca/${LIBDCA_VER}/libdca-${LIBDCA_VER}.tar.bz2" -o "$WORK/src.tar.bz2"
          tar -xjf "$WORK/src.tar.bz2" -C "$WORK"
          SRC="$WORK/libdca-${LIBDCA_VER}"
          cp Libraries/libdca/config.h "$SRC/config.h"
          mkdir -p Libraries/libdca/include
          cp "$SRC/include/dca.h" Libraries/libdca/include/dca.h

          # 用 macOS 的 arm64 目标（同架构、同编译器、同优化级别），
          # 这样产出的 object 才能链进 macOS 命令行程序里跑
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          for variant in A B; do
            EXTRA=""
            if [ "$variant" = "A" ]; then EXTRA="-fno-strict-aliasing"; fi
            for f in bitstream downmix parse; do
              xcrun --sdk macosx clang -arch arm64 -mmacosx-version-min=11.0 -isysroot "$SDK" \
                -O2 -w -fno-common $EXTRA \
                -I"$SRC" -I"$SRC/include" -I"$SRC/libdca" \
                -c "$SRC/libdca/$f.c" -o "$WORK/$f.$variant.o"
            done
            /usr/bin/libtool -static -o "Libraries/libdca/libdca$variant.a" \
              "$WORK/bitstream.$variant.o" "$WORK/downmix.$variant.o" "$WORK/parse.$variant.o"
            lipo -info "Libraries/libdca/libdca$variant.a"
          done

          mkdir -p out
          for variant in A B; do
            swiftc -O \
              -import-objc-header CloudTunes/CloudTunes-Bridging-Header.h \
              -Xcc -ILibraries/libdca/include \
              CloudTunes/Player/DTSDecoder.swift \
              tools/dts-vector/main.swift \
              "Libraries/libdca/libdca$variant.a" \
              -o "out/fingerprint$variant"
          done
          ls -la out

          echo "===== A: -fno-strict-aliasing ====="
          ./out/fingerprintA tools/dts-vector/vector.wav
          echo "===== B: 默认严格别名 ====="
          ./out/fingerprintB tools/dts-vector/vector.wav
          echo "===== A vs B diff（空 = 一致）====="
          ./out/fingerprintA tools/dts-vector/vector.wav > a.txt
          ./out/fingerprintB tools/dts-vector/vector.wav > b.txt
          diff a.txt b.txt || true
          echo "===== DONE ====="

      - name: Publish log to ci-dts-tmp branch
        if: always()
        run: |
          cp dts.log dts-fingerprint.log || true
          git config user.name "ci"
          git config user.email "ci@local"
          git checkout --orphan ci-dts-tmp2
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f dts-fingerprint.log
          git commit -m "dts fingerprint log" || true
          git push -f origin HEAD:ci-dts-tmp
