name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build_output.log

      - name: Errors to summary
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error: |Caused by|What went wrong" -A1 build_output.log | head -120 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Push log to ci-logs branch
        if: failure()
        run: |
          git config user.email "ci-log@example.com"
          git config user.name "ci-log"
          git checkout -q --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          git add -f android/build_output.log
          git commit -qm "ci log run $GITHUB_RUN_ID"
          git push -qf origin ci-logs

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android-${{ github.run_number }}
          name: 安卓版 build ${{ github.run_number }}
          body: |
            CloudTunes 安卓版 APK（调试签名，直接安装即可）。
            - cloudtunes-phone-debug.apk：手机版（Android 8+）
            - cloudtunes-tv-debug.apk：TV 版（Android 7+，TV 桌面可直接启动）
            对应 iOS 端提交：${{ github.sha }}
          files: |
            android/app/build/outputs/apk/debug/cloudtunes-phone-debug.apk
            android/tv/build/outputs/apk/debug/cloudtunes-tv-debug.apk
