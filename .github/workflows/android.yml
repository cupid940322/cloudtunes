name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon 2>&1 | tee build_output.log

      - name: Errors to summary
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error: |Caused by|What went wrong" -A1 build_output.log | head -120 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Push log to ci-logs branch
        if: failure()
        run: |
          git config user.email "ci-log@example.com"
          git config user.name "ci-log"
          git checkout -q --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          git add -f android/build_output.log
          git commit -qm "ci log run $GITHUB_RUN_ID"
          git push -qf origin ci-logs

      - name: Prepare Guangya-ready names
        working-directory: android
        run: |
          V=${{ github.run_number }}
          cp app/build/outputs/apk/debug/cloudtunes-phone-debug.apk app/build/outputs/apk/debug/cloudtunes-phone-1.0.$V.apk
          cp tv/build/outputs/apk/debug/cloudtunes-tv-debug.apk tv/build/outputs/apk/debug/cloudtunes-tv-1.0.$V.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android-${{ github.run_number }}
          name: 安卓版 build ${{ github.run_number }}
          body: |
            CloudTunes 安卓版 v1.0.${{ github.run_number }}（调试签名，直接安装即可，App 内「我的 → 版本更新」可自检升级）。
            - cloudtunes-phone-debug.apk：手机版（Android 8+）
            - cloudtunes-tv-debug.apk：TV 版（Android 7+，TV 桌面可直接启动）
            - cloudtunes-phone-1.0.${{ github.run_number }}.apk / cloudtunes-tv-1.0.${{ github.run_number }}.apk：**带版本号的文件名**，下载后直接丢进光鸭云盘根目录（或 CloudTunes 文件夹），App 就会从光鸭检查更新，不受网络限制。
            对应提交：${{ github.sha }}
          files: |
            android/app/build/outputs/apk/debug/cloudtunes-phone-debug.apk
            android/tv/build/outputs/apk/debug/cloudtunes-tv-debug.apk
            android/app/build/outputs/apk/debug/cloudtunes-phone-1.0.${{ github.run_number }}.apk
            android/tv/build/outputs/apk/debug/cloudtunes-tv-1.0.${{ github.run_number }}.apk

      - name: Publish update manifest
        run: |
          mkdir -p update
          cat > update/android-latest.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "tag": "app-android-${{ github.run_number }}",
            "apkPhone": "https://github.com/cupid940322/cloudtunes/releases/download/app-android-${{ github.run_number }}/cloudtunes-phone-debug.apk",
            "apkTv": "https://github.com/cupid940322/cloudtunes/releases/download/app-android-${{ github.run_number }}/cloudtunes-tv-debug.apk",
            "notes": "CloudTunes 安卓版 v1.0.${{ github.run_number }}",
            "publishedAt": "${{ github.event.head_commit.timestamp }}"
          }
          EOF
          git config user.email "ci-update@example.com"
          git config user.name "ci-update"
          git add -f update/android-latest.json
          git commit -qm "chore(update): android v1.0.${{ github.run_number }}" || echo "清单内容无变化"
          # iOS 流程也在往 main 推版本号，这里重试几次避免 push 被拒
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1 || true
            if git push -q origin HEAD:main; then
              echo "更新清单已发布 v1.0.${{ github.run_number }}"
              exit 0
            fi
            sleep 5
          done
          echo "更新清单推送失败（APK 已发布，App 仍可用 Releases API 兜底）"
