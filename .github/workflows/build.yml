name: Build iOS (unsigned ipa)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'repo.json'
      - 'icon.png'
      - 'VERSION'
  workflow_dispatch:
  # 兜底：GitHub 免费 macOS runner 偶尔排不到机器（任务在 Set up job 卡 15 分钟后
  # 被 cancelled），push 触发的构建会白跑。每天 UTC 10:00（美西凌晨 2 点）
  # 低峰时段固定构建一次，保证代码最终一定能出包。
  schedule:
    - cron: '0 10 * * *'

jobs:
  build:
    # macos-15 / macos-14 池子近期长期排不到 runner（任务在 Set up job 卡住后被取消），
    # 换 macos-13 的 Intel 池试试；它同样带 Xcode 15，iOS 16 部署目标没问题。
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: |
          VERSION=$(cat VERSION | tr -d ' \r\n')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          echo "本次构建版本：$VERSION (${{ github.run_number }})"

      - name: Build libdca (DTS decoder)
        run: |
          set -euo pipefail
          LIBDCA_VER=0.0.7
          WORK="$RUNNER_TEMP/libdca"
          rm -rf "$WORK"; mkdir -p "$WORK"
          URL="https://download.videolan.org/pub/videolan/libdca/${LIBDCA_VER}/libdca-${LIBDCA_VER}.tar.bz2"
          curl -fsSL "$URL" -o "$WORK/src.tar.bz2"
          tar -xjf "$WORK/src.tar.bz2" -C "$WORK"
          SRC="$WORK/libdca-${LIBDCA_VER}"

          # libdca 的 config.h 由 autoconf 生成，tarball 里没有 → 用仓库里手写的那份
          cp Libraries/libdca/config.h "$SRC/config.h"

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Libraries/libdca/include
          cp "$SRC/include/dca.h" Libraries/libdca/include/dca.h

          # 库本体只有三个 .c（bitstream/downmix/parse），纯 C 无外部依赖
          for f in bitstream downmix parse; do
            xcrun --sdk iphoneos clang \
              -arch arm64 -miphoneos-version-min=16.0 -isysroot "$SDK" \
              -O2 -w -fno-common \
              -I"$SRC" -I"$SRC/include" -I"$SRC/libdca" \
              -c "$SRC/libdca/$f.c" -o "$WORK/$f.o"
          done
          /usr/bin/libtool -static -o Libraries/libdca/libdca.a \
            "$WORK/bitstream.o" "$WORK/downmix.o" "$WORK/parse.o"
          lipo -info Libraries/libdca/libdca.a
          nm -g Libraries/libdca/libdca.a | grep " T _dca_" | head -20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project CloudTunes.xcodeproj \
            -scheme CloudTunes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build 2>&1 | tee build.log | tail -n 40

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Post error tail as commit comment (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # xcodebuild 的日志里有一行几万字符的 swift-frontend 命令行，
          # 直接 `tail -150` 会被那一行吃满 60000 字符配额，真正的 error 全被截掉。
          # 所以先抽 error 行，再补带行号定位的上下文和末尾几十行（每行截断）。
          {
            echo "### 编译错误（error/fatal error）"
            grep -nE "error:|fatal error:|BUILD FAILED|The following build commands failed" build.log \
              | cut -c1-400 | head -n 40 || echo "（未捕获到 error 关键字，可能编译进程被系统杀掉）"
            echo
            echo "### 出错文件定位"
            grep -oE "/Users/runner/work/[^ :\"]+\.(swift|m|mm|h|c):[0-9]+:[0-9]+: error:" build.log \
              | head -n 20 || true
            echo
            echo "### 日志末尾 40 行（每行截断 240 字符）"
            tail -n 40 build.log | cut -c1-240
          } > err.txt
          echo "摘要大小：$(wc -c < err.txt) 字节"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(head -c 60000 err.txt)"
          echo "错误已发布到 commit 评论"

      - name: Package unsigned ipa
        run: |
          brew install ldid
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CloudTunes.app Payload/

          APP_PLIST=Payload/CloudTunes.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PLIST"
          echo "App 版本已写入：$APP_VERSION ($BUILD_NUMBER)"

          # ── 显示名必须是纯 ASCII ──────────────────────────────────
          # AltStore / SideStore 在注册 App ID 时会过滤掉非 ASCII 字符，
          # 中文名被过滤成空串 → 报 `The name "" contains invalid characters`，装不上。
          # 所以包内写英文名，桌面中文名靠 zh-Hans.lproj/InfoPlist.strings 覆盖。
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName TangYuanMusic" "$APP_PLIST"
          mkdir -p Payload/CloudTunes.app/zh-Hans.lproj
          cp CloudTunes/Resources/zh-Hans.lproj/InfoPlist.strings Payload/CloudTunes.app/zh-Hans.lproj/
          echo "显示名：Info.plist=TangYuanMusic，中文覆盖=zh-Hans.lproj/InfoPlist.strings"

          WIDGET_APPex=$(find Payload/CloudTunes.app/PlugIns -name "CloudTunesWidget.appex" -type d 2>/dev/null | head -1)
          if [ -n "$WIDGET_APPex" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$WIDGET_APPex/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$WIDGET_APPex/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName TangYuanMusicWidget" "$WIDGET_APPex/Info.plist"
            mkdir -p "$WIDGET_APPex/zh-Hans.lproj"
            cp CloudTunes/Resources/zh-Hans.lproj/InfoPlist.strings "$WIDGET_APPex/zh-Hans.lproj/"
            ldid -SCloudTunesWidget/CloudTunesWidget.entitlements "$WIDGET_APPex/CloudTunesWidget"
            echo "小组件版本已写入：$APP_VERSION ($BUILD_NUMBER)"
          fi

          # 用 ldid 把 entitlements（App Group）嵌入二进制，
          # AltStore 重新签名时会读取并为其生成带 App Group 的描述文件
          ldid -SCloudTunes/CloudTunes.entitlements Payload/CloudTunes.app/CloudTunes

          zip -qry CloudTunes-unsigned.ipa Payload
          # 带版本号的文件名：每次发布 URL 都不同，避免镜像缓存旧包
          cp CloudTunes-unsigned.ipa "CloudTunes-$APP_VERSION-$BUILD_NUMBER.ipa"
          ls -lh CloudTunes-unsigned.ipa "CloudTunes-$APP_VERSION-$BUILD_NUMBER.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudTunes-unsigned-ipa
          path: CloudTunes-unsigned.ipa
          retention-days: 30

      - name: Publish ipa as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: CloudTunes 最新安装包
          body: |
            云音盒 CloudTunes 未签名 ipa（由 CI 自动构建，可直接用 Sideloadly 签名安装）
            版本：${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
            构建提交：${{ github.sha }}
          files: |
            CloudTunes-unsigned.ipa
            CloudTunes-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}.ipa

      - name: Update AltStore source (repo.json)
        run: |
          SIZE=$(stat -f%z CloudTunes-unsigned.ipa)
          export IPA_SIZE=$SIZE
          node -e '
          const fs = require("fs");
          const p = "repo.json";
          const s = JSON.parse(fs.readFileSync(p, "utf8"));
          const app = s.apps[0];
          const v = app.versions[0];
          const ver = process.env.APP_VERSION;
          const build = process.env.BUILD_NUMBER;
          const size = Number(process.env.IPA_SIZE);
          v.version = ver;
          v.buildVersion = build;
          v.date = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
          v.size = size;
          v.downloadURL = "https://gh-proxy.com/https://github.com/cupid940322/cloudtunes/releases/download/app-latest/CloudTunes-" + ver + "-" + build + ".ipa";
          v.localizedDescription = "版本 " + ver + "（构建 " + build + "），由 CI 自动发布。";
          app.size = size;
          fs.writeFileSync(p, JSON.stringify(s, null, 2) + "\n");
          console.log("repo.json 已更新：" + ver + " (" + build + "), " + size + " bytes");
          '
          NEXT=$(node -e '
          const v = process.env.APP_VERSION.split(".");
          const i = v.length - 1;
          const n = Number(v[i]) + 1;
          v[i] = String(isNaN(n) ? 1 : n);
          console.log(v.join("."));
          ')
          echo "$NEXT" > VERSION
          echo "下次构建版本号将自动为：$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json VERSION
          if git diff --cached --quiet; then
            echo "无需提交"
          else
            git commit -m "chore(release): 发布 ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})，版本号自动递增至 $NEXT [skip ci]"
            git push
          fi
