name: Build iOS (unsigned ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project CloudTunes.xcodeproj \
            -scheme CloudTunes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 40

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Post error tail as commit comment (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(tail -n 150 build.log | head -c 60000)"
          echo "错误已发布到 commit 评论"

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CloudTunes.app Payload/
          zip -qry CloudTunes-unsigned.ipa Payload
          ls -lh CloudTunes-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudTunes-unsigned-ipa
          path: CloudTunes-unsigned.ipa
          retention-days: 30
